[project]
name = "stock-analyzer-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "kiteconnect>=5.2.2",
    "litellm>=1.108.0",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.2",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.1.8",
    "tenacity>=9.2.1",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
ignore = ["RUF012", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
